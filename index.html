<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Qué tanto me conoces? // 90s Street Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-tag" aria-hidden="true">90s // STREET</div>

  <main class="app">
    <header class="header">
      <div class="sticker-row">
        <span class="sticker sticker-pink">SIDE A // 90S</span>
        <span class="sticker sticker-cyan">RAP • GRAFOS • XBOX</span>
      </div>
      <h1 class="titulo-principal">¿QUÉ TANTO ME CONOCES?</h1>
      <p class="subtitle">
        <span class="prompt-symbol">&gt;_</span> EDICIÓN CALLEJERA • 10 RONDAS
      </p>
    </header>

    <!-- Pantalla inicial -->
    <section id="pantalla-inicio" class="panel">
      <div class="panel-top">
        <span class="panel-tag">TRACK 00 // IDENTIFICACIÓN</span>
        <span class="panel-dots">● ● ●</span>
      </div>

      <label for="input-nombre" class="label">¿CÓMO TE LLAMAS?</label>
      <input
        type="text"
        id="input-nombre"
        class="input"
        placeholder="Escribe tu apodo o nombre (si queda vacío: parcero)"
        autocomplete="off"
      />

      <button type="button" id="btn-empezar" class="btn btn-acid">
        [ PLAY TAPE // EMPEZAR ]
      </button>
    </section>

    <!-- Pantalla del quiz -->
    <section id="pantalla-quiz" class="panel hidden">
      <div class="panel-top">
        <span id="progreso-texto" class="panel-tag">RONDA 01 / 10</span>
        <span id="marcador-vivo" class="marcador">✔ 0 &nbsp;|&nbsp; ✘ 0</span>
      </div>

      <div class="ecualizador-barra" aria-hidden="true">
        <div id="barra-relleno" class="barra-relleno"></div>
      </div>

      <h2 id="pregunta-texto" class="pregunta"></h2>

      <input
        type="text"
        id="input-respuesta"
        class="input"
        placeholder="Tira tu respuesta aquí..."
        autocomplete="off"
      />
      <button type="button" id="btn-responder" class="btn btn-cyan">
        LANZAR RESPUESTA
      </button>

      <div id="mensaje-respuesta" class="feedback hidden" role="status"></div>

      <button type="button" id="btn-siguiente" class="btn btn-pink hidden">
        SIGUIENTE PISTA &gt;&gt;
      </button>
    </section>

    <!-- Pantalla final -->
    <section id="pantalla-resultado" class="panel hidden">
      <div class="panel-top">
        <span class="panel-tag">FINAL MIX // RESULTADO</span>
        <span class="panel-dots">★ ★ ★</span>
      </div>

      <h2 id="titulo-resultado" class="resultado-titulo"></h2>
      <p id="frase-resultado" class="resultado-frase"></p>

      <div class="estadisticas">
        <div class="stat stat-buena">
          <span id="total-buenas" class="stat-num">0</span>
          <span class="stat-label">BUENAS</span>
        </div>
        <div class="stat stat-mala">
          <span id="total-malas" class="stat-num">0</span>
          <span class="stat-label">MALAS</span>
        </div>
      </div>

      <button type="button" id="btn-reiniciar" class="btn btn-acid">
        [ REWIND // JUGAR DE NUEVO ]
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
